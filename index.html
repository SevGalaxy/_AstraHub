  <title>_AstraHub | Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #090b14;
      color: #f5f5ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 8%;
      border-bottom: 1px solid #252941;
      background: #0d1020;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #a78bfa;
    }

    nav a {
      color: #c6c8dc;
      text-decoration: none;
      margin-left: 22px;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: #c4b5fd;
    }

    main {
      width: min(1050px, 88%);
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: 110px 0 85px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #51417f;
      border-radius: 30px;
      background: #17132b;
      color: #c4b5fd;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 6rem);
      letter-spacing: -4px;
      line-height: 1.05;
      margin-bottom: 24px;
    }

    h1 span {
      color: #a78bfa;
    }

    .hero p {
      max-width: 570px;
      margin: 0 auto;
      color: #a7abc4;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    .button {
      display: inline-block;
      padding: 14px 21px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s, background 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .primary {
      background: #a78bfa;
      color: #100b20;
    }

    .secondary {
      border: 1px solid #393d59;
      color: #f5f5ff;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 90px;
    }

    .card {
      display: block;
      padding: 26px;
      background: #111426;
      border: 1px solid #252941;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #a78bfa;
      transform: translateY(-4px);
    }

    .icon {
      font-size: 2rem;
      margin-bottom: 18px;
    }

    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .card p {
      color: #a7abc4;
      line-height: 1.65;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 28px 15px;
      border-top: 1px solid #252941;
      color: #8589a5;
      font-size: 0.9rem;
    }
