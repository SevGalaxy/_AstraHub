<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101020">
  <title>Giveaways | _AstraHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f4f0ff;
      background: linear-gradient(135deg, #101020, #21123b);
    }

    header {
      max-width: 850px;
      margin: 0 auto 40px;
    }

    header a {
      color: #c9a5ff;
      text-decoration: none;
    }

    main {
      max-width: 560px;
      margin: auto;
      padding: 32px;
      border: 1px solid #49336d;
      border-radius: 20px;
      background: rgba(20, 17, 39, 0.95);
      box-shadow: 0 15px 50px #0005;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      color: #c7bfdc;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      color: white;
      background: #100d20;
      border: 1px solid #58447a;
      border-radius: 9px;
      font-size: 1rem;
    }

    .check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      font-weight: normal;
      line-height: 1.5;
    }

    .check input {
      margin-top: 4px;
      accent-color: #a56bff;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: linear-gradient(90deg, #7847db, #a34ee8);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    .back {
      display: inline-block;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">← Back to _AstraHub</a>
  </header>

  <main>
    <h1>🎁 Giveaway Entry</h1>

    <p>
      Enter your details below to submit your giveaway entry.
      The host will review entries and check eligibility before
      choosing a winner.
    </p>

    <form id="giveaway-form">
      <label for="entrant-name">Your name or username</label>
      <input
        id="entrant-name"
        name="entrant-name"
        type="text"
        maxlength="60"
        required
        autocomplete="nickname"
        placeholder="Enter your name or username"
      >

      <label for="prize-username">Account username for the prize</label>
      <input
        id="prize-username"
        name="prize-username"
        type="text"
        maxlength="60"
        required
        placeholder="Public username only — never your password"
      >

      <label class="check">
        <input id="knows-host" type="checkbox" required>
        <span>I confirm that I know the giveaway host.</span>
      </label>

      <label class="check">
        <input id="rules-accepted" type="checkbox" required>
        <span>
          I confirm my details are correct and that I have read
          and accepted the giveaway rules.
        </span>
      </label>

      <button id="submit-button" type="submit">
        Submit Entry
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back" href="index.html">Return to homepage</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const form = document.getElementById("giveaway-form");
    const message = document.getElementById("message");
    const button = document.getElementById("submit-button");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      button.disabled = true;
      message.textContent = "Submitting your entry...";

      try {
        if (
          typeof SUPABASE_URL === "undefined" ||
          typeof SUPABASE_ANON_KEY === "undefined"
        ) {
          throw new Error("The database configuration could not be loaded.");
        }

        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

        const { error } = await client
          .from("giveaway_entries")
          .insert({
            entrant_name: document.getElementById("entrant-name").value.trim(),
            prize_username: document.getElementById("prize-username").value.trim(),
            knows_host: document.getElementById("knows-host").checked,
            rules_accepted: document.getElementById("rules-accepted").checked,
            review_status: "pending"
          });

        if (error) throw error;

        form.reset();
        message.textContent =
          "✅ Entry submitted! Your entry is awaiting the host's review.";
      } catch (error) {
        console.error("Giveaway submission failed:", error);
        message.textContent =
          "❌ We couldn't submit your entry. Please try again later.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
